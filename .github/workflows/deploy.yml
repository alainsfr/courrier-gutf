name: Deploy (PlanetHoster - tar.gz)

on:
  push:
    branches: ["main"]

concurrency:
  group: courrier-gutf-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Install Composer deps (build)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM deps
        run: npm ci

      - name: Build assets (Vite)
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PH_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.PH_SSH_PORT }}" -H "${{ secrets.PH_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Build deploy artifact (tar.gz)
        run: |
          set -e
          rm -rf deploy_artifact
          mkdir -p deploy_artifact/app
          mkdir -p deploy_artifact/public

          # App payload: everything except public/ (includes vendor/)
          rsync -a --delete --exclude "public" ./ deploy_artifact/app/

          # Public payload: public/ only
          rsync -a --delete public/ deploy_artifact/public/

          # Safety: never ship env file
          rm -f deploy_artifact/app/.env || true

          tar -czf deploy_artifact.tar.gz -C deploy_artifact .

      - name: Upload artifact to server
        run: |
          scp -P "${{ secrets.PH_SSH_PORT }}" deploy_artifact.tar.gz \
            "${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }}:${{ secrets.PH_DEPLOY_PATH }}/deploy_artifact.tar.gz"

      - name: Deploy artifact on server (atomic-ish)
        run: |
          ssh -p "${{ secrets.PH_SSH_PORT }}" "${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }}" << 'EOF'
          set -e

          DEPLOY_PATH="${{ secrets.PH_DEPLOY_PATH }}"
          TMP_DIR="$DEPLOY_PATH/.deploy_tmp"

          mkdir -p "$DEPLOY_PATH/app"
          mkdir -p "$DEPLOY_PATH/shared/storage"
          mkdir -p "$TMP_DIR"

          # Extract
          tar -xzf "$DEPLOY_PATH/deploy_artifact.tar.gz" -C "$TMP_DIR"
          rm -f "$DEPLOY_PATH/deploy_artifact.tar.gz"

          # Clear app except .env (kept if exists)
          find "$DEPLOY_PATH/app" -mindepth 1 -maxdepth 1 ! -name ".env" -exec rm -rf {} \;

          # Copy app + public into place
          cp -R "$TMP_DIR/app/." "$DEPLOY_PATH/app/"
          cp -R "$TMP_DIR/public/." "$DEPLOY_PATH/"

          # Root index.php for /courrier/app
          cp -f "$DEPLOY_PATH/deploy/production-root-index.php" "$DEPLOY_PATH/index.php" || true

          # Clean temp
          rm -rf "$TMP_DIR"

          echo "Artifact deployed"
          EOF

      - name: Post-deploy (no composer, robust)
        run: |
          ssh -p "${{ secrets.PH_SSH_PORT }}" "${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }}" << 'EOF'
          set -e

          DEPLOY_PATH="${{ secrets.PH_DEPLOY_PATH }}"
          cd "$DEPLOY_PATH/app"

          # Verify app is present
          test -f artisan || (echo "artisan missing in $DEPLOY_PATH/app" && exit 1)

          # Ensure .env exists (never overwrite)
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

          # Persist storage (and ensure required dirs exist)
          mkdir -p "$DEPLOY_PATH/shared/storage"
          rm -rf storage
          ln -s "$DEPLOY_PATH/shared/storage" storage

          # Required Laravel runtime dirs
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs

          # APP_KEY only if missing
          if ! grep -q "^APP_KEY=" .env || grep -q "^APP_KEY=$" .env; then
            php artisan key:generate --force
          fi

          # Public storage link for our layout:
          # DocumentRoot is $DEPLOY_PATH (not app/public)
          # We create: /home/ydykrmdy/courrier/storage -> /home/ydykrmdy/courrier/app/storage/app/public
          mkdir -p "$DEPLOY_PATH/app/storage/app/public"
          rm -rf "$DEPLOY_PATH/storage"
          ln -s "$DEPLOY_PATH/app/storage/app/public" "$DEPLOY_PATH/storage" || true

          # Clear caches safely (avoid view:clear if path not ready)
          php artisan config:clear || true
          php artisan route:clear || true

          # Cache (these rely on storage/framework existing)
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo "Deploy OK"
          EOF
