name: Deploy (PlanetHoster)

on:
  push:
    branches: ["main"]

concurrency:
  group: courrier-gutf-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build PHP deps on CI (server has no composer)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Install Composer deps (build)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Build Vite assets on CI
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM deps
        run: npm ci

      - name: Build assets (Vite)
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PH_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.PH_SSH_PORT }}" -H "${{ secrets.PH_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare remote directories
        run: |
          ssh -p "${{ secrets.PH_SSH_PORT }}" "${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }}" << 'EOF'
          set -e
          DEPLOY_PATH="${{ secrets.PH_DEPLOY_PATH }}"
          mkdir -p "$DEPLOY_PATH/app"
          mkdir -p "$DEPLOY_PATH/shared/storage"
          echo "Remote directories ready"
          EOF

      # 1) Deploy app (everything except public/) INTO /courrier/app
      # Includes vendor/ generated by CI (no composer needed on server)
      - name: Deploy app code to server (/app)
        run: |
          rsync -az --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude "node_modules/" \
            --exclude "public/" \
            --exclude ".env" \
            --exclude "storage/" \
            -e "ssh -p ${{ secrets.PH_SSH_PORT }}" \
            ./ "${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }}:${{ secrets.PH_DEPLOY_PATH }}/app/"

      # 2) Deploy public/ to DocumentRoot (/courrier)
      - name: Deploy public/ to DocumentRoot
        run: |
          rsync -az --delete \
            --exclude ".env" \
            -e "ssh -p ${{ secrets.PH_SSH_PORT }}" \
            public/ "${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }}:${{ secrets.PH_DEPLOY_PATH }}/"

      # 3) Root index.php adapted to /courrier/app
      - name: Upload root index.php
        run: |
          scp -P "${{ secrets.PH_SSH_PORT }}" deploy/production-root-index.php \
            "${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }}:${{ secrets.PH_DEPLOY_PATH }}/index.php"

      # 4) Post-deploy without composer (server doesn't have it)
      - name: Post-deploy (no composer)
        run: |
          ssh -p "${{ secrets.PH_SSH_PORT }}" "${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }}" << 'EOF'
          set -e

          DEPLOY_PATH="${{ secrets.PH_DEPLOY_PATH }}"
          cd "$DEPLOY_PATH/app"

          # Ensure .env exists (never overwrite)
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

          # Persist storage
          rm -rf storage
          ln -s "$DEPLOY_PATH/shared/storage" storage

          # Generate APP_KEY only if missing (do NOT rotate each deploy)
          if ! grep -q "^APP_KEY=" .env || grep -q "^APP_KEY=$" .env; then
            php artisan key:generate --force
          fi

          php artisan storage:link || true

          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo "Deploy OK"
          EOF
