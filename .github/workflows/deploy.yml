name: Deploy (PlanetHoster - tar.gz)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: courrier-gutf-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: courrier_concurrency_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd, zip, mbstring, pdo_mysql, pdo_sqlite
          tools: composer:v2

      - name: Install dependencies for verification
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Verify operational scripts
        run: |
          bash -n deploy/install-cron.sh deploy/run-operations.sh
          bash tests/Operations/cron.sh

      - name: Verify application before deployment
        env:
          APP_ENV: testing
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php vendor/bin/phpunit --do-not-cache-result

      - name: Verify concurrent registrations and PIN protection on MySQL
        env:
          APP_ENV: testing
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: courrier_concurrency_test
          DB_USERNAME: root
          DB_PASSWORD: ci-test-only
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          BROADCAST_CONNECTION: "null"
        run: php tests/Concurrency/registration.php

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd, zip, mbstring, pdo_mysql
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM deps
        run: npm ci

      - name: Build assets (Vite)
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PH_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.PH_SSH_PORT }}" -H "${{ secrets.PH_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Build deploy artifact (tar.gz)
        run: |
          set -e
          rm -rf deploy_artifact
          mkdir -p deploy_artifact/app
          mkdir -p deploy_artifact/public

          # Keep runtime data, secrets and build inputs out of the release.
          rsync -a \
            --include '/.env.example' \
            --exclude '/.env*' --exclude '/.git' --exclude '/.github' \
            --exclude '/node_modules' --exclude '/deploy_artifact' \
            --exclude '/deploy_artifact.tar.gz' --exclude '/public' \
            --exclude '/storage' --exclude '/bootstrap/cache/*.php' \
            --exclude '/database/*.sqlite*' \
            --exclude '/tests' --exclude '/tools/constructor' --exclude '/repopack-output.txt' \
            ./ deploy_artifact/app/
          mkdir -p deploy_artifact/app/bootstrap/cache

          # Public payload: public/ only
          rsync -a --exclude '/hot' --exclude '/storage' public/ deploy_artifact/public/

          # Safety: never ship env file
          rm -f deploy_artifact/app/.env || true

          tar -czf deploy_artifact.tar.gz -C deploy_artifact .

      - name: Upload artifact to server
        run: |
          scp -P "${{ secrets.PH_SSH_PORT }}" deploy_artifact.tar.gz \
            "${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }}:${{ secrets.PH_DEPLOY_PATH }}/deploy_artifact.tar.gz"

      - name: Back up and deploy artifact on server
        run: |
          ssh -p "${{ secrets.PH_SSH_PORT }}" "${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }}" << 'EOF'
          set -e

          DEPLOY_PATH="${{ secrets.PH_DEPLOY_PATH }}"
          TMP_DIR="$DEPLOY_PATH/.deploy_tmp"

          case "$DEPLOY_PATH" in
            /*) ;;
            *) echo "Deploy path must be absolute" >&2; exit 1 ;;
          esac
          test "$DEPLOY_PATH" != / || exit 1
          test -f "$DEPLOY_PATH/app/.env" || { echo "Existing production .env missing" >&2; exit 1; }
          DEPLOY_PATH="$(cd "$DEPLOY_PATH" && pwd -P)"
          test "$DEPLOY_PATH" != / || exit 1
          TMP_DIR="$DEPLOY_PATH/.deploy_tmp"
          php -r 'if (PHP_VERSION_ID < 80300) { fwrite(STDERR, "PHP 8.3 or newer is required\n"); exit(1); }'

          mkdir -p "$DEPLOY_PATH/app"
          mkdir -p "$DEPLOY_PATH/shared/storage"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"
          printf '%s\n' 'Require all denied' > "$DEPLOY_PATH/shared/.htaccess"
          printf '%s\n' 'Require all denied' > "$TMP_DIR/.htaccess"

          # Preserve files even when upgrading an installation without the shared link.
          if [ -d "$DEPLOY_PATH/app/storage" ] && [ ! -L "$DEPLOY_PATH/app/storage" ]; then
            rsync -a "$DEPLOY_PATH/app/storage/" "$DEPLOY_PATH/shared/storage/"
          fi

          # Extract
          tar -xzf "$DEPLOY_PATH/deploy_artifact.tar.gz" -C "$TMP_DIR"
          rm -f "$DEPLOY_PATH/deploy_artifact.tar.gz"
          cp -f "$TMP_DIR/public/.htaccess" "$DEPLOY_PATH/.htaccess"

          # Verify the new runtime and back up the database before replacing any code.
          cp -p "$DEPLOY_PATH/app/.env" "$TMP_DIR/app/.env"
          ln -s "$DEPLOY_PATH/shared/storage" "$TMP_DIR/app/storage"
          mkdir -p "$TMP_DIR/app/storage/framework/cache/data" "$TMP_DIR/app/storage/framework/sessions"
          mkdir -p "$TMP_DIR/app/storage/framework/views" "$TMP_DIR/app/storage/logs"
          (
            cd "$TMP_DIR/app"
            php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); if (!$app->environment("production")) { fwrite(STDERR, "APP_ENV must be production\n"); exit(1); }'
            php artisan backup:run --only-db --disable-notifications
          )
          rm "$TMP_DIR/app/.env"

          # Clear app except .env (kept if exists)
          find "$DEPLOY_PATH/app" -mindepth 1 -maxdepth 1 ! -name ".env" -exec rm -rf {} \;

          # Copy app + public into place
          cp -R "$TMP_DIR/app/." "$DEPLOY_PATH/app/"
          cp -R "$TMP_DIR/public/." "$DEPLOY_PATH/"

          # Root index.php for /courrier/app
          cp -f "$DEPLOY_PATH/app/deploy/production-root-index.php" "$DEPLOY_PATH/index.php"

          # Clean temp
          rm -rf "$TMP_DIR"

          echo "Artifact deployed"
          EOF

      - name: Post-deploy (no composer, robust)
        run: |
          ssh -p "${{ secrets.PH_SSH_PORT }}" "${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }}" << 'EOF'
          set -e

          DEPLOY_PATH="${{ secrets.PH_DEPLOY_PATH }}"
          cd "$DEPLOY_PATH/app"

          # Verify app is present
          test -f artisan || (echo "artisan missing in $DEPLOY_PATH/app" && exit 1)

          test -f .env || { echo "Production .env missing" >&2; exit 1; }

          # Persist storage (and ensure required dirs exist)
          mkdir -p "$DEPLOY_PATH/shared/storage"
          rm -rf storage
          ln -s "$DEPLOY_PATH/shared/storage" storage

          # Required Laravel runtime dirs
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs

          # APP_KEY only if missing
          if ! grep -q "^APP_KEY=" .env || grep -q "^APP_KEY=$" .env; then
            php artisan key:generate --force
          fi

          # Public storage link for our layout:
          # DocumentRoot is $DEPLOY_PATH (not app/public)
          # We create: /home/ydykrmdy/courrier/storage -> /home/ydykrmdy/courrier/app/storage/app/public
          mkdir -p "$DEPLOY_PATH/app/storage/app/public"
          rm -rf "$DEPLOY_PATH/storage"
          ln -s "$DEPLOY_PATH/app/storage/app/public" "$DEPLOY_PATH/storage" || true

          # Clear caches safely (avoid view:clear if path not ready)
          php artisan config:clear || true
          php artisan route:clear || true

          php artisan migrate --force

          php artisan db:seed --force --class=RolesAndPermissionsSeeder
          php artisan db:seed --force --class=BureauSeeder
          php artisan db:seed --force --class=WorkflowEtapesSeeder
          php artisan db:seed --force --class=SuperAdminSeeder

          # Cache (these rely on storage/framework existing)
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan queue:restart

          # Preserve the existing tasks belonging to other applications.
          bash deploy/install-cron.sh "$DEPLOY_PATH/app" "$(command -v php)"

          echo "Deploy OK"
          EOF
