name: Deploy (PlanetHoster)

on:
  push:
    branches: ["main"]

concurrency:
  group: courrier-gutf-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Install Composer dependencies (build)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets (Vite)
        run: npm run build

      - name: Validate required secrets (fail fast)
        run: |
          test -n "${{ secrets.PH_SSH_HOST }}" || (echo "Missing secret: PH_SSH_HOST" && exit 1)
          test -n "${{ secrets.PH_SSH_PORT }}" || (echo "Missing secret: PH_SSH_PORT" && exit 1)
          test -n "${{ secrets.PH_SSH_USER }}" || (echo "Missing secret: PH_SSH_USER" && exit 1)
          test -n "${{ secrets.PH_DEPLOY_PATH }}" || (echo "Missing secret: PH_DEPLOY_PATH" && exit 1)
          test -n "${{ secrets.PH_SSH_KEY }}"  || (echo "Missing secret: PH_SSH_KEY" && exit 1)

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PH_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.PH_SSH_PORT }}" -H "${{ secrets.PH_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare remote directories
        run: |
          ssh -p ${{ secrets.PH_SSH_PORT }} ${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }} << 'EOF'
          set -e
          DEPLOY_PATH="${{ secrets.PH_DEPLOY_PATH }}"

          mkdir -p "$DEPLOY_PATH/app"
          mkdir -p "$DEPLOY_PATH/shared/storage"
          mkdir -p "$DEPLOY_PATH/shared/bootstrap-cache"

          echo "Remote directories ready"
          EOF
      
      - name: Build deploy artifact (tar.gz)
        run: |
          rm -rf deploy_artifact
          mkdir -p deploy_artifact/app
          mkdir -p deploy_artifact/public

          # App code = repo minus public/
          rsync -a --delete --exclude "public" ./ deploy_artifact/app/
          # Public = public/
          rsync -a --delete public/ deploy_artifact/public/

          # Safety
          rm -f deploy_artifact/app/.env || true
          rm -rf deploy_artifact/app/node_modules || true

          tar -czf deploy_artifact.tar.gz -C deploy_artifact .

      - name: Upload artifact to server
        run: |
          scp -P ${{ secrets.PH_SSH_PORT }} deploy_artifact.tar.gz \
            ${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }}:${{ secrets.PH_DEPLOY_PATH }}/deploy_artifact.tar.gz

      - name: Deploy artifact on server
        run: |
          ssh -p ${{ secrets.PH_SSH_PORT }} ${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }} << 'EOF'
          set -e

          DEPLOY_PATH="${{ secrets.PH_DEPLOY_PATH }}"
          TMP_DIR="$DEPLOY_PATH/.deploy_tmp"

          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"

          tar -xzf "$DEPLOY_PATH/deploy_artifact.tar.gz" -C "$TMP_DIR"
          rm -f "$DEPLOY_PATH/deploy_artifact.tar.gz"

          # Ensure dirs
          mkdir -p "$DEPLOY_PATH/app"
          mkdir -p "$DEPLOY_PATH/shared/storage"

          # Clear app except .env
          find "$DEPLOY_PATH/app" -mindepth 1 -maxdepth 1 ! -name ".env" -exec rm -rf {} \;

          # Copy app payload
          cp -R "$TMP_DIR/app/." "$DEPLOY_PATH/app/"

          # Copy public payload to DocumentRoot
          cp -R "$TMP_DIR/public/." "$DEPLOY_PATH/"

          rm -rf "$TMP_DIR"
          echo "Artifact deployed"
          EOF

      - name: Upload root index.php
        run: |
          scp -P ${{ secrets.PH_SSH_PORT }} deploy/production-root-index.php \
          ${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }}:${{ secrets.PH_DEPLOY_PATH }}/index.php

      - name: Post-deploy (Laravel optimizations)
        run: |
          ssh -p ${{ secrets.PH_SSH_PORT }} ${{ secrets.PH_SSH_USER }}@${{ secrets.PH_SSH_HOST }} << 'EOF'
          set -e

          DEPLOY_PATH="${{ secrets.PH_DEPLOY_PATH }}"
          cd "$DEPLOY_PATH/app"

          # Ensure .env exists (never overwrite)
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

          # Persist storage
          rm -rf storage
          ln -s "$DEPLOY_PATH/shared/storage" storage

          # Install prod deps
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

          # Generate APP_KEY only if missing (do NOT rotate on each deploy)
          if ! grep -q "^APP_KEY=" .env || grep -q "^APP_KEY=$" .env; then
            php artisan key:generate --force
          fi

          php artisan storage:link || true

          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo "Post-deploy OK"
          EOF

